<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>welch-fun</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff; color: #111; min-height: 100vh;
    }
    #page { max-width: 780px; margin: 0 auto; padding: 56px 24px 80px; }
    #header { text-align: center; margin-bottom: 56px; }
    #logo { display: inline-flex; align-items: center; gap: 14px; }
    #logo-badge {
      width: 48px; height: 48px; border-radius: 12px;
      background: #d42b2b; transform: rotate(-8deg);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #logo-badge span {
      transform: rotate(8deg); color: #fff;
      font-size: 26px; font-weight: 800;
    }
    #logo h1 { font-size: 40px; font-weight: 800; letter-spacing: -1.5px; color: #111; }
    #logo h1 span { color: #d42b2b; }
    #header p { font-size: 15px; color: #999; margin-top: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 16px; }
    .card {
      background: #fff; border: 1px solid #e8e8e8; border-radius: 18px;
      padding: 30px 20px 24px; cursor: pointer; text-decoration: none;
      display: flex; flex-direction: column; align-items: center; gap: 13px;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s; color: inherit;
    }
    .card:hover { border-color: #c8c8c8; transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.07); }
    .card:active { transform: translateY(-1px); }
    .icon { width: 68px; height: 68px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .card-title { font-size: 15px; font-weight: 600; color: #111; text-align: center; }
    .card-desc  { font-size: 12px; color: #aaa; text-align: center; line-height: 1.5; }
    #footer { text-align: center; margin-top: 64px; font-size: 12px; color: #ccc; letter-spacing: 0.3px; }
    @media (max-width: 480px) {
      #logo h1 { font-size: 30px; }
      #logo-badge { width: 40px; height: 40px; border-radius: 10px; }
      #logo-badge span { font-size: 21px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    }
  </style>
</head>
<body>
  <div id="page">
    <div id="header">
      <div id="logo">
        <div id="logo-badge"><span>w</span></div>
        <h1>welch<span>fun</span></h1>
      </div>
      <p>A growing collection of little things to click, press, and play with.</p>
    </div>

    <div class="grid">

      <!-- RED BUTTON -->
      <a class="card" href="red-button.html">
        <div class="icon" style="background:#fff0f0; border:2px solid #ffd0d0;">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
            <circle cx="18" cy="18" r="15" fill="#c02020"/>
            <circle cx="18" cy="18" r="13" fill="#d42b2b"/>
            <circle cx="18" cy="18" r="11" fill="#e03535"/>
            <ellipse cx="13" cy="12" rx="5" ry="3.2" fill="rgba(255,185,185,0.55)"/>
            <circle cx="18" cy="18" r="10.5" fill="none" stroke="rgba(90,0,0,0.18)" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="card-title">Red button</div>
        <div class="card-desc">Press it. You know you want to.</div>
      </a>

      <!-- BLACKJACK -->
      <a class="card" href="blackjack.html">
        <div class="icon" style="background:#f0f0f0; border:2px solid #ddd;">
          <svg width="38" height="38" viewBox="0 0 38 38" fill="none">
            <!-- Card 1 (slightly behind, tilted left) -->
            <rect x="2" y="7" width="22" height="28" rx="3" fill="#fff" stroke="#ccc" stroke-width="1.2" transform="rotate(-8 13 21)"/>
            <text x="5" y="18" font-family="serif" font-size="10" font-weight="900" fill="#111" transform="rotate(-8 13 21)">A</text>
            <text x="5" y="27" font-family="serif" font-size="9" fill="#111" transform="rotate(-8 13 21)">♠</text>
            <!-- Card 2 (front, tilted right) -->
            <rect x="14" y="5" width="22" height="28" rx="3" fill="#fff" stroke="#ccc" stroke-width="1.2" transform="rotate(6 25 19)"/>
            <text x="16" y="17" font-family="serif" font-size="10" font-weight="900" fill="#d42b2b" transform="rotate(6 25 19)">K</text>
            <text x="17" y="26" font-family="serif" font-size="9" fill="#d42b2b" transform="rotate(6 25 19)">♥</text>
          </svg>
        </div>
        <div class="card-title">Blackjack</div>
        <div class="card-desc">Beat the dealer to 21.</div>
      </a>

      <!-- ROULETTE -->
      <a class="card" href="roulette.html">
        <div class="icon" style="background:#0f0f0f; border:2px solid #333;">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="17" fill="#1a1a1a" stroke="#444" stroke-width="1.5"/>
            <circle cx="20" cy="20" r="12" fill="none" stroke="#333" stroke-width="1"/>
            <!-- coloured slices hint -->
            <path d="M20 3 A17 17 0 0 1 34.7 11.5 L20 20Z" fill="#d42b2b" opacity="0.9"/>
            <path d="M34.7 11.5 A17 17 0 0 1 34.7 28.5 L20 20Z" fill="#222"/>
            <path d="M34.7 28.5 A17 17 0 0 1 20 37 L20 20Z" fill="#d42b2b" opacity="0.7"/>
            <path d="M20 37 A17 17 0 0 1 5.3 28.5 L20 20Z" fill="#222"/>
            <path d="M5.3 28.5 A17 17 0 0 1 5.3 11.5 L20 20Z" fill="#d42b2b" opacity="0.5"/>
            <path d="M5.3 11.5 A17 17 0 0 1 20 3 L20 20Z" fill="#222"/>
            <circle cx="20" cy="20" r="5" fill="#111" stroke="#555" stroke-width="1"/>
            <circle cx="20" cy="20" r="2" fill="#d42b2b"/>
            <!-- pointer -->
            <polygon points="20,1 17,7 23,7" fill="#ffd700"/>
          </svg>
        </div>
        <div class="card-title">Roulette</div>
        <div class="card-desc">Spin the wheel. Risk your points.</div>
      </a>

    </div>

    <div id="footer">made with curiosity &amp; claude</div>
  </div>
</body>
</html>
