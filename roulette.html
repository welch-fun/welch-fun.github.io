<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roulette — Welchy-Wagers</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100vh;
  background: #0a0a0a;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #fff;
  overflow-x: hidden;
}

#home-btn {
  position: fixed; top: 16px; left: 16px; z-index: 999;
  display: flex; align-items: center; gap: 6px;
  padding: 8px 14px; background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.13); border-radius: 10px;
  text-decoration: none; color: #aaa; font-size: 13px; font-weight: 600;
  transition: background 0.15s;
}
#home-btn:hover { background: rgba(255,255,255,0.13); }

/* ── LAYOUT ── */
#page {
  display: flex; flex-direction: column; align-items: center;
  padding: 56px 16px 40px; gap: 20px; max-width: 900px; margin: 0 auto;
}

h1 { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
h1 span { color: #d42b2b; }

/* ── POINTS ── */
#points-bar {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; padding: 8px 18px;
  font-size: 13px; font-weight: 700; color: #777;
}
#points-bar strong { color: #fff; font-size: 18px; }

/* ── WHEEL SECTION ── */
#wheel-section {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
#wheel-wrap {
  position: relative; width: 200px; height: 200px;
}
#wheel-canvas {
  width: 200px; height: 200px; border-radius: 50%;
  box-shadow: 0 0 0 5px #1c1c1c, 0 0 0 9px #2e2e2e, 0 6px 40px rgba(0,0,0,0.8);
  display: block;
}
#wheel-pointer {
  position: absolute; top: -16px; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 9px solid transparent;
  border-right: 9px solid transparent;
  border-top: 20px solid #ffd700;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
  z-index: 2;
}
#spin-result-badge {
  min-height: 44px; display: flex; align-items: center; justify-content: center;
}
#spin-result-badge .pill {
  display: none; padding: 8px 24px; border-radius: 30px;
  font-size: 20px; font-weight: 800; letter-spacing: -0.5px;
  animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes popIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
#spin-result-badge .pill.red-pill   { background: #d42b2b; color: #fff; }
#spin-result-badge .pill.black-pill { background: #fff; color: #111; }
#spin-result-badge .pill.green-pill { background: #1a7a1a; color: #fff; }

/* ── CHIP TRAY ── */
#chip-tray {
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
}
.chip {
  width: 48px; height: 48px; border-radius: 50%; border: 3px dashed;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 800; cursor: pointer; text-align: center;
  transition: transform 0.12s, box-shadow 0.12s;
  user-select: none;
}
.chip:hover { transform: scale(1.1); }
.chip.selected { box-shadow: 0 0 0 3px #fff; transform: scale(1.12); }
.chip-10   { background:#1e3a5f; border-color:#4a90d9; color:#7ab8f5; }
.chip-100  { background:#1f3d1f; border-color:#4caf50; color:#7ed97e; }
.chip-500  { background:#3d1f1f; border-color:#d42b2b; color:#ff7070; }
.chip-1000 { background:#2d2010; border-color:#ff9800; color:#ffb74d; }
.chip-2500 { background:#2a1a3d; border-color:#9c27b0; color:#ce93d8; }
.chip-5000 { background:#1a1a1a; border-color:#ffd700; color:#ffd700; }

/* ── TABLE ── */
#table-wrap {
  width: 100%; max-width: 820px;
  background: #0e3320;
  border: 3px solid #1e5c38;
  border-radius: 16px;
  padding: 14px;
  box-shadow: inset 0 0 60px rgba(0,0,0,0.4), 0 8px 40px rgba(0,0,0,0.6);
  position: relative;
  overflow: visible;
}

/* Grid of numbers */
#number-grid {
  display: grid;
  /* 0 col + 12 number cols */
  grid-template-columns: 44px repeat(12, 1fr);
  grid-template-rows: repeat(3, 44px);
  gap: 3px;
  margin-bottom: 3px;
}

.num-cell {
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800;
  cursor: pointer; position: relative;
  border: 1.5px solid rgba(255,255,255,0.08);
  transition: filter 0.12s, transform 0.1s;
  user-select: none;
}
.num-cell:hover { filter: brightness(1.4); transform: scale(1.06); z-index: 2; }
.num-cell.active { outline: 2px solid #ffd700; z-index: 3; }
.num-cell.zero-cell {
  grid-row: 1 / 4; grid-column: 1;
  font-size: 14px; border-radius: 6px;
  background: #1a7a1a; writing-mode: vertical-rl;
  text-orientation: mixed; letter-spacing: 2px;
}
.num-cell.red-cell   { background: #8b1010; }
.num-cell.black-cell { background: #1a1a1a; }

/* Outside bets row */
#outside-bets {
  display: grid;
  grid-template-columns: 44px repeat(6, 1fr);
  gap: 3px;
  margin-bottom: 3px;
}
#outside-bets .spacer { grid-column: 1; }

/* Dozens row */
#dozens-row {
  display: grid;
  grid-template-columns: 44px repeat(3, 1fr);
  gap: 3px;
  margin-bottom: 3px;
}
#dozens-row .spacer { grid-column: 1; }

/* Column bets */
#col-bets {
  display: grid;
  grid-template-columns: 44px repeat(12, 1fr);
  gap: 3px;
}
#col-bets .spacer { grid-column: 1; }

.outside-cell {
  border-radius: 5px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800;
  cursor: pointer; position: relative;
  border: 1.5px solid rgba(255,255,255,0.12);
  transition: filter 0.12s, transform 0.1s;
  user-select: none; letter-spacing: 0.5px;
}
.outside-cell:hover { filter: brightness(1.4); transform: scaleY(1.06); }
.outside-cell.active { outline: 2px solid #ffd700; }

.cell-red   { background: #7a0e0e; color: #ff9090; }
.cell-black { background: #111; color: #ccc; }
.cell-muted { background: rgba(255,255,255,0.05); color: #aaa; }
.cell-green { background: #0d4020; color: #5dba80; }

/* Placed chip on table */
.placed-chip {
  position: absolute; width: 26px; height: 26px; border-radius: 50%;
  border: 2px dashed; display: flex; align-items: center; justify-content: center;
  font-size: 7px; font-weight: 900; pointer-events: none; z-index: 10;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  animation: chipDrop 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes chipDrop {
  from { transform: translate(-50%, calc(-50% - 30px)) scale(0.5); opacity: 0; }
  to   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

/* ── SPIN CONTROLS ── */
#spin-controls {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center;
}
#bet-summary {
  font-size: 13px; color: #666; font-weight: 600;
}
#bet-summary span { color: #fff; }

#spin-btn {
  padding: 13px 40px; background: #d42b2b; color: #fff;
  border: none; border-radius: 12px; font-size: 16px; font-weight: 800;
  cursor: pointer; letter-spacing: -0.3px;
  transition: background 0.15s, transform 0.1s;
}
#spin-btn:hover:not(:disabled) { background: #e03535; }
#spin-btn:active:not(:disabled) { transform: scale(0.97); }
#spin-btn:disabled { opacity: 0.3; cursor: not-allowed; }

#clear-btn {
  padding: 13px 20px; background: rgba(255,255,255,0.06); color: #888;
  border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
  font-size: 14px; font-weight: 700; cursor: pointer;
  transition: background 0.15s;
}
#clear-btn:hover { background: rgba(255,255,255,0.1); color: #ccc; }

/* ── ROUND RESULT ── */
#round-result {
  display: none; padding: 14px 20px; border-radius: 12px;
  text-align: center; font-size: 18px; font-weight: 800;
  min-width: 260px;
}
#round-result.win  { background: #0d2b0d; color: #4caf50; border: 1px solid #4caf5033; }
#round-result.lose { background: #2b0d0d; color: #d42b2b; border: 1px solid #d42b2b33; }
#round-result.push { background: #1a1a1a; color: #888;    border: 1px solid #33333366; }

/* ── BANKRUPT ── */
#bankrupt-screen {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.94); z-index: 9999;
  flex-direction: column; align-items: center;
  justify-content: center; gap: 16px; text-align: center; padding: 24px;
}
#bankrupt-screen.show { display: flex; }
#bankrupt-screen h2 {
  font-size: 52px; font-weight: 800; color: #d42b2b; letter-spacing: -2px;
  animation: shake 0.5s ease;
}
@keyframes shake {
  0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-14px); }
  40%{ transform:translateX(14px); } 60%{ transform:translateX(-9px); } 80%{ transform:translateX(9px); }
}
#bankrupt-screen p { font-size: 15px; color: #555; max-width: 280px; line-height: 1.6; }
#restart-btn {
  margin-top: 8px; padding: 14px 40px;
  background: #d42b2b; color: #fff; border: none; border-radius: 12px;
  font-size: 16px; font-weight: 800; cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
#restart-btn:hover { background: #e03535; }
#restart-btn:active { transform: scale(0.97); }

/* Welchy-Wagers roulette salon */

html,body{background:#090b0b;background-image:radial-gradient(ellipse at 50% 0%,#344337 0,transparent 48%),linear-gradient(180deg,#101513,#080909 78%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}

<body>

<a id="home-btn" href="index.html">&#8592; Welchy-Wagers</a>

<div id="page">
  <h1>Rou<span>lette</span></h1>

  <div id="points-bar">Points: <strong id="points-display">1,000</strong></div>

  <!-- WHEEL -->
  <div id="wheel-section">
    <div id="wheel-wrap">
      <div id="wheel-pointer"></div>
      <canvas id="wheel-canvas" width="400" height="400"></canvas>
    </div>
    <div id="spin-result-badge"><div class="pill" id="result-pill"></div></div>
  </div>

  <!-- CHIP TRAY -->
  <div id="chip-tray">
    <div class="chip chip-10"   data-amount="10"   title="10 pts">10</div>
    <div class="chip chip-100"  data-amount="100"  title="100 pts">100</div>
    <div class="chip chip-500"  data-amount="500"  title="500 pts">500</div>
    <div class="chip chip-1000" data-amount="1000" title="1K pts">1K</div>
    <div class="chip chip-2500" data-amount="2500" title="2.5K pts">2.5K</div>
    <div class="chip chip-5000" data-amount="5000" title="5K pts">5K</div>
  </div>

  <!-- TABLE -->
  <div id="table-wrap">
    <div id="number-grid"></div>
    <div id="col-bets"></div>
    <div id="dozens-row"></div>
    <div id="outside-bets"></div>
  </div>

  <!-- SPIN CONTROLS -->
  <div id="spin-controls">
    <div id="bet-summary">No bet placed</div>
    <button id="clear-btn">Clear</button>
    <button id="spin-btn" disabled>SPIN</button>
  </div>

  <div id="round-result"></div>
</div>

<!-- BANKRUPT -->
<div id="bankrupt-screen">
  <h2>BANKRUPT</h2>
  <p>The wheel has spoken. You've got nothing left. Walk away… or start over.</p>
  <button id="restart-btn">Start over with 1,000 pts</button>
</div>

<script>
// ── Constants ───────────────────────────────────────────────────────────────
const RED_NUMS = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);

// Authentic European roulette wheel order (clockwise from 0)
const WHEEL_ORDER = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const SLICES = WHEEL_ORDER.length; // 37
const ARC = (2 * Math.PI) / SLICES;

// Map number → slice index on wheel
const NUM_TO_SLICE = {};
WHEEL_ORDER.forEach((n, i) => NUM_TO_SLICE[n] = i);

function numColor(n) {
  if (n === 0) return '#1a7a1a';
  return RED_NUMS.has(n) ? '#9b1515' : '#1a1a1a';
}

// ── Wheel drawing ───────────────────────────────────────────────────────────
const canvas = document.getElementById('wheel-canvas');
const ctx = canvas.getContext('2d');
const CX = 200, CY = 200, R = 196, INNER = 48;

// wheelAngle: current rotation of the wheel.
// Slice i occupies angles [wheelAngle + i*ARC - PI/2, wheelAngle + i*ARC - PI/2 + ARC]
// The pointer is at the TOP (angle = -PI/2 from center).
// A slice is "under the pointer" when its midpoint angle = -PI/2 (mod 2PI)
// i.e., wheelAngle + (i + 0.5)*ARC ≡ -PI/2 + PI/2 = 0 ... actually:
// midpoint of slice i = wheelAngle - PI/2 + (i+0.5)*ARC
// for it to point UP (angle 0 from top, i.e., -PI/2 from standard):
// wheelAngle - PI/2 + (i+0.5)*ARC = -PI/2 + k*2PI
// => wheelAngle = -i*ARC - ARC/2 + k*2PI  — this is used in spin calc

let wheelAngle = 0;

function drawWheel(angle) {
  ctx.clearRect(0, 0, 400, 400);
  for (let i = 0; i < SLICES; i++) {
    const start = angle - Math.PI / 2 + i * ARC;
    const end   = start + ARC;
    const num   = WHEEL_ORDER[i];

    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, start, end);
    ctx.closePath();
    ctx.fillStyle = numColor(num);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    const mid = start + ARC / 2;
    const tx = CX + (R - 24) * Math.cos(mid);
    const ty = CY + (R - 24) * Math.sin(mid);
    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(mid + Math.PI / 2);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${SLICES > 30 ? 11 : 13}px -apple-system,sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(num, 0, 0);
    ctx.restore();
  }
  // Ball track ring
  ctx.beginPath();
  ctx.arc(CX, CY, R - 6, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 5;
  ctx.stroke();

  // Hub
  ctx.beginPath();
  ctx.arc(CX, CY, INNER, 0, Math.PI * 2);
  ctx.fillStyle = '#0f0f0f';
  ctx.fill();
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(CX, CY, 14, 0, Math.PI * 2);
  ctx.fillStyle = '#d42b2b';
  ctx.fill();
}
drawWheel(0);

// ── State ───────────────────────────────────────────────────────────────────
let points = 1000;
let selectedChip = 0;
let bets = {}; // betKey → { amount, type, label, payout }
let spinning = false;

// ── Chip tray ───────────────────────────────────────────────────────────────
document.querySelectorAll('.chip').forEach(c => {
  c.addEventListener('click', () => {
    if (spinning) return;
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('selected'));
    c.classList.add('selected');
    selectedChip = parseInt(c.dataset.amount);
  });
});

function getChipClass(amount) {
  const map = {10:'chip-10',100:'chip-100',500:'chip-500',1000:'chip-1000',2500:'chip-2500',5000:'chip-5000'};
  // find nearest
  const keys = [10,100,500,1000,2500,5000];
  let best = keys[0];
  for (let k of keys) { if (amount >= k) best = k; }
  return map[best];
}
function getChipColors(amount) {
  if (amount >= 5000) return { bg:'#1a1a1a', border:'#ffd700', color:'#ffd700' };
  if (amount >= 2500) return { bg:'#2a1a3d', border:'#9c27b0', color:'#ce93d8' };
  if (amount >= 1000) return { bg:'#2d2010', border:'#ff9800', color:'#ffb74d' };
  if (amount >= 500)  return { bg:'#3d1f1f', border:'#d42b2b', color:'#ff7070' };
  if (amount >= 100)  return { bg:'#1f3d1f', border:'#4caf50', color:'#7ed97e' };
  return { bg:'#1e3a5f', border:'#4a90d9', color:'#7ab8f5' };
}

// ── Place chip on a cell ─────────────────────────────────────────────────────
function placeChip(el, betKey, betType, betLabel, payout) {
  if (spinning) return;
  if (!selectedChip) { flashMessage('Pick a chip first!'); return; }
  if (selectedChip > points) { flashMessage('Not enough points!'); return; }

  // Add to bet
  if (!bets[betKey]) bets[betKey] = { amount: 0, type: betType, label: betLabel, payout };
  bets[betKey].amount += selectedChip;
  points -= selectedChip;
  updatePoints();
  updateBetSummary();

  // Mark cell active
  el.classList.add('active');

  // Remove existing chip marker, add new one
  const old = el.querySelector('.placed-chip');
  if (old) old.remove();

  const { bg, border, color } = getChipColors(bets[betKey].amount);
  const chip = document.createElement('div');
  chip.className = 'placed-chip';
  chip.style.background = bg;
  chip.style.borderColor = border;
  chip.style.color = color;
  chip.textContent = bets[betKey].amount >= 1000
    ? (bets[betKey].amount/1000).toFixed(bets[betKey].amount%1000===0?0:1)+'K'
    : bets[betKey].amount;
  el.appendChild(chip);

  document.getElementById('spin-btn').disabled = false;
  document.getElementById('round-result').style.display = 'none';
}

// ── Build the table ──────────────────────────────────────────────────────────
// Number layout: roulette table has 3 rows, cols 1-12 across top
// Row 1: 3,6,9,12,15,18,21,24,27,30,33,36
// Row 2: 2,5,8,11,14,17,20,23,26,29,32,35
// Row 3: 1,4,7,10,13,16,19,22,25,28,31,34
const TABLE_ROWS = [
  [3,6,9,12,15,18,21,24,27,30,33,36],
  [2,5,8,11,14,17,20,23,26,29,32,35],
  [1,4,7,10,13,16,19,22,25,28,31,34]
];

function buildTable() {
  const grid = document.getElementById('number-grid');
  grid.innerHTML = '';

  // Zero
  const zeroEl = document.createElement('div');
  zeroEl.className = 'num-cell zero-cell';
  zeroEl.textContent = '0';
  zeroEl.dataset.key = 'num-0';
  grid.appendChild(zeroEl);
  zeroEl.addEventListener('click', () =>
    placeChip(zeroEl, 'num-0', 'number', '0', 35));

  // Number cells
  TABLE_ROWS.forEach((row) => {
    row.forEach(n => {
      const el = document.createElement('div');
      el.className = 'num-cell ' + (RED_NUMS.has(n) ? 'red-cell' : 'black-cell');
      el.textContent = n;
      el.dataset.key = 'num-' + n;
      grid.appendChild(el);
      el.addEventListener('click', () =>
        placeChip(el, 'num-' + n, 'number', '' + n, 35));
    });
  });

  // Column bets (2to1 on far right of each row)
  const colBets = document.getElementById('col-bets');
  colBets.innerHTML = '';
  const spacer = document.createElement('div');
  spacer.className = 'spacer';
  colBets.appendChild(spacer);
  // 12 columns = each col covers numbers in that vertical column on the table
  // Actually in roulette "column" means a row of 12: col1=1-12 area row, col2=13-24, col3=25-36
  // But table columns here are the 12 vertical strips. The 2:1 bets are the 3 ROW 2:1 bets.
  // Let's do row 2:1 (right side of each row)
  // We'll add them as spanning cells after col 12 — but since grid ends at col 13,
  // we put them in a separate flex row below instead. They're labelled 2:1.
  ['Col 1\n1-34','Col 2\n2-35','Col 3\n3-36'].forEach((label, i) => {
    const groups = [TABLE_ROWS[2], TABLE_ROWS[1], TABLE_ROWS[0]];
    const group = groups[i];
    // span 4 cells each (12 cols / 3 = 4)
    const el = document.createElement('div');
    el.className = 'outside-cell cell-muted';
    el.style.gridColumn = `span 4`;
    el.style.fontSize = '10px';
    el.textContent = '2:1';
    el.title = label;
    colBets.appendChild(el);
    el.addEventListener('click', () =>
      placeChip(el, 'col-'+(i+1), 'column', 'Col '+(i+1), 2));
  });

  // Dozens
  const dozensRow = document.getElementById('dozens-row');
  dozensRow.innerHTML = '';
  const sp2 = document.createElement('div'); sp2.className='spacer'; dozensRow.appendChild(sp2);
  [['1st 12','dozen-1',1,12],['2nd 12','dozen-2',13,24],['3rd 12','dozen-3',25,36]].forEach(([label,key,lo,hi])=>{
    const el = document.createElement('div');
    el.className='outside-cell cell-muted';
    el.textContent=label;
    dozensRow.appendChild(el);
    el.addEventListener('click',()=>placeChip(el,key,'dozen',label,2));
  });

  // Outside bets
  const outside = document.getElementById('outside-bets');
  outside.innerHTML = '';
  const sp3 = document.createElement('div'); sp3.className='spacer'; outside.appendChild(sp3);
  const outsideDefs = [
    { key:'low',   label:'1-18',  cls:'cell-muted', type:'low',   payout:1 },
    { key:'even',  label:'EVEN',  cls:'cell-muted', type:'even',  payout:1 },
    { key:'red',   label:'●',     cls:'cell-red',   type:'red',   payout:1 },
    { key:'black', label:'●',     cls:'cell-black', type:'black', payout:1 },
    { key:'odd',   label:'ODD',   cls:'cell-muted', type:'odd',   payout:1 },
    { key:'high',  label:'19-36', cls:'cell-muted', type:'high',  payout:1 },
  ];
  outsideDefs.forEach(({ key, label, cls, type, payout }) => {
    const el = document.createElement('div');
    el.className = 'outside-cell ' + cls;
    el.textContent = label;
    el.title = label;
    outside.appendChild(el);
    el.addEventListener('click', () =>
      placeChip(el, key, type, label, payout));
  });
}
buildTable();

// ── Points + bet summary ─────────────────────────────────────────────────────
function updatePoints() {
  document.getElementById('points-display').textContent = points.toLocaleString();
}
function updateBetSummary() {
  const total = Object.values(bets).reduce((s,b)=>s+b.amount,0);
  const el = document.getElementById('bet-summary');
  if (!total) { el.textContent = 'No bet placed'; return; }
  const keys = Object.keys(bets);
  if (keys.length === 1) {
    const b = bets[keys[0]];
    el.innerHTML = `Bet: <span>${b.amount.toLocaleString()} pts</span> on <span>${b.label}</span>`;
  } else {
    el.innerHTML = `${keys.length} bets — <span>${total.toLocaleString()} pts</span> total`;
  }
}
function flashMessage(msg) {
  const el = document.getElementById('bet-summary');
  el.textContent = msg;
  setTimeout(updateBetSummary, 1500);
}

// ── Clear bets ───────────────────────────────────────────────────────────────
document.getElementById('clear-btn').addEventListener('click', () => {
  if (spinning) return;
  const returned = Object.values(bets).reduce((s,b)=>s+b.amount,0);
  points += returned;
  bets = {};
  document.querySelectorAll('.num-cell, .outside-cell').forEach(el => {
    el.classList.remove('active');
    const c = el.querySelector('.placed-chip');
    if (c) c.remove();
  });
  updatePoints();
  updateBetSummary();
  document.getElementById('spin-btn').disabled = true;
  document.getElementById('round-result').style.display = 'none';
});

// ── SPIN ─────────────────────────────────────────────────────────────────────
document.getElementById('spin-btn').addEventListener('click', () => {
  const total = Object.values(bets).reduce((s,b)=>s+b.amount,0);
  if (!total || spinning) return;

  spinning = true;
  document.getElementById('spin-btn').disabled = true;
  document.getElementById('clear-btn').disabled = true;
  document.getElementById('round-result').style.display = 'none';
  document.getElementById('result-pill').style.display = 'none';

  // Pick a random landing number
  const landingNum = WHEEL_ORDER[Math.floor(Math.random() * SLICES)];
  const landingSlice = NUM_TO_SLICE[landingNum];

  // To land slice i under the pointer (top):
  // We need: wheelAngle - PI/2 + (landingSlice + 0.5)*ARC = -PI/2 + k*2PI (pointer is at top = -PI/2)
  // => wheelAngle = -landingSlice*ARC - ARC/2 + k*2PI
  // Add enough full rotations so we always spin forward a lot
  const targetBase = -(landingSlice * ARC) - ARC / 2;
  // Normalise so targetBase is in [0, 2PI)
  let targetNorm = ((targetBase % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  // We want to spin at least 5 full rotations forward from current wheelAngle
  const currentNorm = ((wheelAngle % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  let delta = targetNorm - currentNorm;
  if (delta <= 0) delta += 2 * Math.PI; // always go forward
  const totalRotation = (5 + Math.floor(Math.random() * 5)) * 2 * Math.PI + delta;

  const startAngle = wheelAngle;
  const endAngle   = wheelAngle + totalRotation;
  const duration   = 5000 + Math.random() * 1500;
  const startTime  = performance.now();

  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  function animate(now) {
    const t = Math.min((now - startTime) / duration, 1);
    wheelAngle = startAngle + totalRotation * easeOut(t);
    drawWheel(wheelAngle);
    if (t < 1) { requestAnimationFrame(animate); return; }
    wheelAngle = endAngle;
    drawWheel(wheelAngle);
    resolveRound(landingNum);
  }
  requestAnimationFrame(animate);
});

// ── Resolve ───────────────────────────────────────────────────────────────────
function resolveRound(num) {
  spinning = false;
  document.getElementById('clear-btn').disabled = false;

  const isRed   = RED_NUMS.has(num);
  const isGreen = num === 0;
  const color   = isGreen ? 'green' : isRed ? 'red' : 'black';

  // Result pill
  const pill = document.getElementById('result-pill');
  pill.textContent = num + ' — ' + color.toUpperCase();
  pill.className = 'pill ' + color + '-pill';
  pill.style.display = 'inline-flex';

  let totalWin = 0;
  for (const [key, bet] of Object.entries(bets)) {
    let won = false;
    switch (bet.type) {
      case 'number': won = parseInt(key.replace('num-','')) === num; break;
      case 'red':    won = isRed; break;
      case 'black':  won = !isRed && !isGreen; break;
      case 'odd':    won = !isGreen && num % 2 !== 0; break;
      case 'even':   won = !isGreen && num % 2 === 0; break;
      case 'low':    won = num >= 1 && num <= 18; break;
      case 'high':   won = num >= 19 && num <= 36; break;
      case 'dozen':
        if (key==='dozen-1') won = num>=1&&num<=12;
        else if (key==='dozen-2') won = num>=13&&num<=24;
        else won = num>=25&&num<=36;
        break;
      case 'column':
        const col = parseInt(key.replace('col-',''));
        const colNumbers = TABLE_ROWS[3-col]; // col1=row3, col2=row2, col3=row1
        won = colNumbers.includes(num);
        break;
    }
    if (won) totalWin += bet.amount * (bet.payout + 1); // stake back + profit
  }

  points += totalWin;
  updatePoints();

  const totalStaked = Object.values(bets).reduce((s,b)=>s+b.amount,0);
  const net = totalWin - totalStaked;
  const rr = document.getElementById('round-result');
  if (totalWin > 0) {
    rr.textContent = '+' + net.toLocaleString() + ' pts — Winner!';
    rr.className = 'win';
  } else {
    rr.textContent = '-' + totalStaked.toLocaleString() + ' pts — No luck.';
    rr.className = 'lose';
  }
  rr.style.display = 'block';

  // Clear bets visually
  bets = {};
  document.querySelectorAll('.num-cell, .outside-cell').forEach(el => {
    el.classList.remove('active');
    const c = el.querySelector('.placed-chip');
    if (c) c.remove();
  });
  updateBetSummary();

  if (points <= 0) {
    points = 0;
    updatePoints();
    setTimeout(() => document.getElementById('bankrupt-screen').classList.add('show'), 900);
  }
}

// ── Restart ───────────────────────────────────────────────────────────────────
document.getElementById('restart-btn').addEventListener('click', () => {
  points = 1000; bets = {}; spinning = false; selectedChip = 0; wheelAngle = 0;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
  document.querySelectorAll('.num-cell,.outside-cell').forEach(el=>{
    el.classList.remove('active');
    const c=el.querySelector('.placed-chip'); if(c)c.remove();
  });
  document.getElementById('round-result').style.display='none';
  document.getElementById('result-pill').style.display='none';
  document.getElementById('spin-btn').disabled=true;
  document.getElementById('bankrupt-screen').classList.remove('show');
  updatePoints(); updateBetSummary(); drawWheel(0);
});

updatePoints();
updateBetSummary();
</script>
